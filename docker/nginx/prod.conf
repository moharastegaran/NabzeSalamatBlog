# Production nginx — HTTP origin behind CDN (TLS terminates at CDN).
# CDN should forward X-Forwarded-Proto / Host; Laravel trusts them and
# APP_URL=https://nabzsn.ir forces https URLs to avoid mixed content.

server {
    listen 80;
    listen [::]:80;
    server_name nabzsn.ir www.nabzsn.ir _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 210M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/app-locations.conf;
}
