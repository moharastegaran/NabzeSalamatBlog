# Shared Laravel location blocks for nginx (included by prod/default server configs)

# Use Docker's internal DNS so upstream IPs are re-resolved after container restarts
resolver 127.0.0.11 valid=10s ipv6=off;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Serve uploaded files from the shared storage volume (symlink is only in the app container)
location /storage/ {
    alias /var/www/html/storage/app/public/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt {
    access_log off;
    log_not_found off;
    try_files $uri /index.php?$query_string;
}
location = /sitemap.xml {
    try_files $uri /index.php?$query_string;
}

error_page 404 /index.php;

location ~ \.php$ {
    set $upstream app:9000;
    fastcgi_pass $upstream;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    include fastcgi_params;
    # Pass CDN / reverse-proxy headers through to Laravel (TrustProxies)
    fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
    fastcgi_param HTTP_X_FORWARDED_HOST  $http_x_forwarded_host  if_not_empty;
    fastcgi_param HTTP_X_FORWARDED_PORT  $http_x_forwarded_port  if_not_empty;
    fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 300;
}

location ~ /\.(?!well-known).* {
    deny all;
}
